# ─────────────────────────────────────────────────────────────────────
#  Studies API — contract v1.1.0  (MINOR = additive only)
#
#  Changes vs 1.0.0 — all backward compatible:
#    + Study.priority      new OPTIONAL field
#    + Modality "MG"       new enum value (safe only for tolerant readers)
#
#  Clients generated from 1.0.0 keep working unchanged.
# ─────────────────────────────────────────────────────────────────────
openapi: 3.0.3
info:
  title: Studies API
  version: 1.1.0
servers:
  - url: http://localhost:5080
paths:
  /api/v1/studies:
    get:
      operationId: listStudies
      summary: List imaging studies
      deprecated: true          # v2 is the successor; see Sunset header
      responses:
        '200':
          description: All studies
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Study' }
  /api/v1/studies/{id}:
    get:
      operationId: getStudy
      summary: Get one imaging study
      deprecated: true
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: The study
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Study' }
        '404':
          description: Study not found
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
components:
  schemas:
    Study:
      type: object
      required: [id, patientName, modality]      # priority NOT required → additive
      properties:
        id:          { type: string, example: S-001 }
        patientName: { type: string, example: Somchai Jaidee }
        modality:    { $ref: '#/components/schemas/Modality' }
        priority:    { $ref: '#/components/schemas/Priority' }   # NEW in 1.1.0
    Modality:
      type: string
      description: >-
        OPEN set. New values may be added in a MINOR version,
        so clients MUST tolerate values they do not know.
      enum: [CT, MR, US, XR, MG]                                # MG is NEW in 1.1.0
    Priority:
      type: string
      enum: [routine, stat]
    Problem:
      type: object
      properties:
        title:  { type: string }
        status: { type: integer }
        detail: { type: string }
