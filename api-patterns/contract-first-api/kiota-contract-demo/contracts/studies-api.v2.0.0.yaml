# ─────────────────────────────────────────────────────────────────────
#  Studies API — contract v2.0.0  (MAJOR = breaking changes allowed)
#
#  Breaking changes vs v1:
#    - Study.patientName   → replaced by Study.patient { hn, name }
#    - Study.priority      → now REQUIRED
#
#  Because it breaks, v2 lives on a NEW path (/api/v2) side by side
#  with /api/v1. Old clients are never forced to move on release day.
# ─────────────────────────────────────────────────────────────────────
openapi: 3.0.3
info:
  title: Studies API
  version: 2.0.0
servers:
  - url: http://localhost:5080
paths:
  /api/v2/studies:
    get:
      operationId: listStudies
      summary: List imaging studies
      responses:
        '200':
          description: All studies
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Study' }
  /api/v2/studies/{id}:
    get:
      operationId: getStudy
      summary: Get one imaging study
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: The study
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Study' }
        '404':
          description: Study not found
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
components:
  schemas:
    Study:
      type: object
      required: [id, patient, modality, priority]
      properties:
        id:       { type: string, example: S-001 }
        patient:  { $ref: '#/components/schemas/Patient' }
        modality: { $ref: '#/components/schemas/Modality' }
        priority: { $ref: '#/components/schemas/Priority' }
    Patient:
      type: object
      required: [hn, name]
      properties:
        hn:   { type: string, description: Hospital number, example: '6512345' }
        name: { type: string, example: Somchai Jaidee }
    Modality:
      type: string
      description: >-
        OPEN set. New values may be added in a MINOR version,
        so clients MUST tolerate values they do not know.
      enum: [CT, MR, US, XR, MG]
    Priority:
      type: string
      enum: [routine, stat]
    Problem:
      type: object
      properties:
        title:  { type: string }
        status: { type: integer }
        detail: { type: string }
