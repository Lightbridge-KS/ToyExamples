# ─────────────────────────────────────────────────────────────────────
#  Studies API — contract v1.2.0  ❌ REJECTED BY CI
#
#  Someone "tidied up" a field name and called it a minor release:
#    patientName → patientFullName
#
#  Looks harmless in code review. It is a BREAKING change: every client
#  generated from 1.0.0 / 1.1.0 would silently lose the patient name.
#  scripts/check-breaking.sh (oasdiff) catches this before merge.
# ─────────────────────────────────────────────────────────────────────
openapi: 3.0.3
info:
  title: Studies API
  version: 1.2.0
servers:
  - url: http://localhost:5080
paths:
  /api/v1/studies:
    get:
      operationId: listStudies
      summary: List imaging studies
      deprecated: true
      responses:
        '200':
          description: All studies
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Study' }
  /api/v1/studies/{id}:
    get:
      operationId: getStudy
      summary: Get one imaging study
      deprecated: true
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: The study
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Study' }
        '404':
          description: Study not found
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
components:
  schemas:
    Study:
      type: object
      required: [id, patientFullName, modality]
      properties:
        id:              { type: string, example: S-001 }
        patientFullName: { type: string, example: Somchai Jaidee }   # was: patientName
        modality:        { $ref: '#/components/schemas/Modality' }
        priority:        { $ref: '#/components/schemas/Priority' }
    Modality:
      type: string
      description: >-
        OPEN set. New values may be added in a MINOR version,
        so clients MUST tolerate values they do not know.
      enum: [CT, MR, US, XR, MG]
    Priority:
      type: string
      enum: [routine, stat]
    Problem:
      type: object
      properties:
        title:  { type: string }
        status: { type: integer }
        detail: { type: string }
