[project]
name = "minimd-demo"
version = "0.1.0"
description = "The app: installs minimd, optionally its plugin, and opts in"
authors = [
    { name = "Lightbridge-KS", email = "ki11ip0.s.a.s@gmail.com" }
]
requires-python = ">=3.10"
dependencies = ["minimd"]

[project.optional-dependencies]
# What the app's user would pip install. Each extra changes one demo scene.
yaml = ["minimd[yaml]"]               # scene 5: the host's own optional dependency
plugins = ["minimd-sample-plugin"]    # scene 7: installing the package is the wiring

[dependency-groups]
dev = [
    "ipykernel>=7.3.0",
]
typecheck = [
    "mypy>=2.4.0",
    "types-pyyaml>=6.0.12.20260906",
]

[tool.uv]
package = false  # an app, not a library: nothing to build or publish

# Two vendors' packages, side by side for development: one lockfile, one venv.
[tool.uv.workspace]
members = ["packages/*"]

[tool.uv.sources]
minimd = { workspace = true }
minimd-sample-plugin = { workspace = true }
