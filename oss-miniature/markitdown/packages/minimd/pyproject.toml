[project]
name = "minimd"
version = "0.1.0"
description = "MarkItDown in miniature: the converter registry and dispatch loop of microsoft/markitdown"
authors = [
    { name = "Lightbridge-KS", email = "ki11ip0.s.a.s@gmail.com" }
]
requires-python = ">=3.10"
dependencies = []  # the core needs nothing beyond the standard library

[project.optional-dependencies]
# `pip install minimd[yaml]` lights up YamlConverter. Without it, minimd still
# imports and works; only .yaml conversion falls back (see YamlConverter).
yaml = ["pyyaml"]

# No entry points here. The host names only the group it reads
# (plugin_api.ENTRY_POINT_GROUP); each plugin's own pyproject.toml joins it.

[build-system]
requires = ["uv_build>=0.11.8,<0.12.0"]
build-backend = "uv_build"
